<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-label="Architecture: three uploaded files go through app.py into the Predict Risk stage, which cleans history and builds a quantity forecast held in memory; the Combine stage reads it back, builds the lateness scorecard and trains the miss model, and risk_engine labels each commit HIGH below 85 percent, written to vendor_commit_risk.xlsx; performance_check.py later scores those predictions against actual receipts.">
      <style>
.bg{fill:#ffffff}
text{fill:#16202b;font-family:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;font-size:12px}
.fn{font-family:'JetBrains Mono',Consolas,Menlo,'Courier New',monospace;font-size:12.5px;font-weight:600}
.sub,.elabel{fill:#56626f;font-size:11.5px}.elabel{font-size:11px}
.band{fill:#e9edf2}
.bandlabel{font-family:Archivo,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:14px}
.box{fill:#ffffff;stroke:#c9d1da;stroke-width:1.5}.box.file{stroke:#16202b}
.box.key{fill:#e3ecf8;stroke:#1f5fa8;stroke-width:2}
.store{fill:#ffffff;stroke:#56626f;stroke-width:1.5;stroke-dasharray:5 4}
.edge{stroke:#16202b;stroke-width:1.5;fill:none}.edge.key{stroke:#1f5fa8;stroke-width:2.5}
.keytext{fill:#1f5fa8;font-weight:600}.warntext{fill:#b42318;font-size:11.5px;font-weight:600}
.ah{fill:#16202b}.ah.key{fill:#1f5fa8}
@media (prefers-color-scheme: dark){
.bg{fill:#0f141a}text{fill:#e5eaf0}.sub,.elabel{fill:#9aa6b3}.band{fill:#161d25}
.box,.store{fill:#161d25}.box{stroke:#34404c}.box.file{stroke:#e5eaf0}.box.key{fill:#1a2a3e;stroke:#78aef0}
.edge{stroke:#e5eaf0}.edge.key{stroke:#78aef0}.keytext{fill:#78aef0}.warntext{fill:#f27c70}
.ah{fill:#e5eaf0}.ah.key{fill:#78aef0}}
</style>
      <rect class="bg" x="0" y="0" width="1400" height="610"/>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah key" d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>

      
      <rect class="band" x="222" y="40" width="376" height="440" rx="6"/>
      <text class="bandlabel" x="238" y="64">1 · &#8220;Predict Risk&#8221; button</text>
      <rect class="band" x="802" y="40" width="376" height="440" rx="6"/>
      <text class="bandlabel" x="818" y="64">2 · &#8220;Combine&#8221; button</text>

      
      <text class="bandlabel" x="20" y="64">Uploaded files</text>
      <text class="sub" x="20" y="86">columns mapped in the browser</text>
      <rect class="box file" x="20" y="110" width="170" height="56" rx="4"/>
      <text class="fn" x="105" y="134" text-anchor="middle">Historical Commits</text>
      <text class="sub" x="105" y="152" text-anchor="middle">past commits + receipts</text>
      <rect class="box file" x="20" y="230" width="170" height="56" rx="4"/>
      <text class="fn" x="105" y="254" text-anchor="middle">Current Commits</text>
      <text class="sub" x="105" y="272" text-anchor="middle">open commits to score</text>
      <rect class="box file" x="20" y="350" width="170" height="56" rx="4"/>
      <text class="fn" x="105" y="374" text-anchor="middle">Owner Matrix</text>
      <text class="sub" x="105" y="392" text-anchor="middle">vendor → buyer</text>
      <polyline class="edge" points="190,138 208,138"/>
      <polyline class="edge" points="190,258 208,258"/>
      <polyline class="edge" points="190,378 208,378 208,103"/>
      <line class="edge" x1="208" y1="103" x2="248" y2="103" marker-end="url(#ah)"/>

      
      <rect class="box" x="250" y="80" width="320" height="46" rx="4"/>
      <text class="fn" x="410" y="99" text-anchor="middle">app.py  /run_forecast</text>
      <text class="sub" x="410" y="116" text-anchor="middle">web UI · checks and remaps the columns</text>

      <rect class="box" x="250" y="150" width="320" height="46" rx="4"/>
      <text class="fn" x="410" y="169" text-anchor="middle">upload_services.py</text>
      <text class="sub" x="410" y="186" text-anchor="middle">runs stage 1 · loads commits and owner matrix</text>

      <rect class="box" x="250" y="220" width="320" height="46" rx="4"/>
      <text class="fn" x="410" y="239" text-anchor="middle">data_processing.py</text>
      <text class="sub" x="410" y="256" text-anchor="middle">cleans history · working days late per delivery</text>

      <rect class="box" x="250" y="290" width="320" height="46" rx="4"/>
      <text class="fn" x="410" y="309" text-anchor="middle">forecast_build_services.py</text>
      <text class="sub" x="410" y="326" text-anchor="middle">loops vendor-material pairs (5+ deliveries)</text>

      <rect class="box" x="250" y="370" width="150" height="56" rx="4"/>
      <text class="fn" x="325" y="392" text-anchor="middle">model.py</text>
      <text class="sub" x="325" y="410" text-anchor="middle">XGBoost qty forecast</text>
      <rect class="box" x="420" y="370" width="150" height="56" rx="4"/>
      <text class="fn" x="495" y="388" text-anchor="middle">forecast_accuracy</text>
      <text class="fn" x="495" y="403" text-anchor="middle">_services.py</text>
      <text class="sub" x="495" y="419" text-anchor="middle">holdout backtest</text>

      <line class="edge" x1="410" y1="126" x2="410" y2="148" marker-end="url(#ah)"/>
      <line class="edge" x1="410" y1="196" x2="410" y2="218" marker-end="url(#ah)"/>
      <text class="elabel" x="418" y="211">history file</text>
      <line class="edge" x1="410" y1="266" x2="410" y2="288" marker-end="url(#ah)"/>
      <text class="elabel" x="418" y="281">clean rows</text>
      <line class="edge" x1="325" y1="336" x2="325" y2="368" marker-end="url(#ah)"/>
      <line class="edge" x1="495" y1="336" x2="495" y2="368" marker-end="url(#ah)"/>

      
      <rect class="store" x="625" y="150" width="150" height="230" rx="6"/>
      <text class="fn" x="700" y="174" text-anchor="middle">Held in memory</text>
      <text class="sub" x="700" y="192" text-anchor="middle">one user at a time</text>
      <text x="700" y="222" text-anchor="middle">forecast rows</text>
      <text x="700" y="238" text-anchor="middle">+ history rows</text>
      <text x="700" y="268" text-anchor="middle">current commits</text>
      <text x="700" y="298" text-anchor="middle">owner matrix</text>
      <text x="700" y="328" text-anchor="middle">accuracy metrics</text>
      <text class="sub" x="700" y="404" text-anchor="middle">shown in browser:</text>
      <text class="sub" x="700" y="420" text-anchor="middle">accuracy · forecast.csv</text>
      <line class="edge" x1="570" y1="173" x2="623" y2="173" marker-end="url(#ah)"/>
      <text class="elabel" x="597" y="166" text-anchor="middle">commits</text>
      <line class="edge" x1="570" y1="313" x2="623" y2="313" marker-end="url(#ah)"/>
      <text class="elabel" x="597" y="306" text-anchor="middle">forecast</text>

      
      <rect class="box" x="830" y="80" width="320" height="46" rx="4"/>
      <text class="fn" x="990" y="99" text-anchor="middle">app.py  /combine</text>
      <text class="sub" x="990" y="116" text-anchor="middle">starts stage 2 · writes the Excel file</text>

      <rect class="box" x="830" y="150" width="320" height="62" rx="4"/>
      <text class="fn" x="990" y="169" text-anchor="middle">combine_services.py</text>
      <text class="sub" x="990" y="185" text-anchor="middle">forecast window · day/week/month buckets · buyer</text>
      <text class="warntext" x="990" y="202" text-anchor="middle">commits with no quantity forecast are dropped</text>

      <rect class="box" x="820" y="250" width="160" height="56" rx="4"/>
      <text class="fn" x="900" y="272" text-anchor="middle">lateness_services.py</text>
      <text class="sub" x="900" y="290" text-anchor="middle">late-rate scorecard</text>
      <rect class="box key" x="1000" y="250" width="160" height="56" rx="4"/>
      <text class="fn" x="1080" y="272" text-anchor="middle">ml_risk_services.py</text>
      <text class="sub keytext" x="1080" y="290" text-anchor="middle">XGBoost miss model</text>

      <rect class="box key" x="830" y="340" width="320" height="56" rx="4"/>
      <text class="fn" x="990" y="362" text-anchor="middle">risk_engine.py</text>
      <text class="sub" x="990" y="380" text-anchor="middle">HIGH below 85% · else scorecard, then quantity</text>

      <line class="edge" x1="775" y1="181" x2="828" y2="181" marker-end="url(#ah)"/>
      <text class="elabel" x="802" y="174" text-anchor="middle">reads</text>
      <line class="edge" x1="990" y1="126" x2="990" y2="148" marker-end="url(#ah)"/>
      <line class="edge" x1="900" y1="212" x2="900" y2="248" marker-end="url(#ah)"/>
      <text class="elabel" x="894" y="234" text-anchor="end">history rows</text>
      <line class="edge" x1="1080" y1="212" x2="1080" y2="248" marker-end="url(#ah)"/>
      <text class="elabel" x="1088" y="234">history + commits</text>
      <line class="edge" x1="980" y1="278" x2="998" y2="278" marker-end="url(#ah)"/>
      <line class="edge" x1="900" y1="306" x2="900" y2="338" marker-end="url(#ah)"/>
      <text class="elabel" x="894" y="326" text-anchor="end">fallback</text>
      <line class="edge key" x1="1080" y1="306" x2="1080" y2="338" marker-end="url(#ahk)"/>
      <text class="elabel keytext" x="1088" y="326">chance met</text>

      
      <rect class="box file" x="1215" y="330" width="165" height="76" rx="4"/>
      <text class="fn" x="1297" y="354" text-anchor="middle">vendor_commit_risk</text>
      <text class="fn" x="1297" y="369" text-anchor="middle">.xlsx</text>
      <text class="sub" x="1297" y="388" text-anchor="middle">Risk Output · Accuracy</text>
      <line class="edge" x1="1150" y1="368" x2="1213" y2="368" marker-end="url(#ah)"/>
      <text class="elabel" x="1182" y="361" text-anchor="middle">rows</text>

      
      <text class="bandlabel" x="20" y="514">3 · Later, after deliveries arrive</text>
      <rect class="box file" x="20" y="530" width="170" height="56" rx="4"/>
      <text class="fn" x="105" y="554" text-anchor="middle">Receipts file</text>
      <text class="sub" x="105" y="572" text-anchor="middle">actual goods receipts</text>
      <rect class="box" x="830" y="530" width="240" height="56" rx="4"/>
      <text class="fn" x="950" y="552" text-anchor="middle">performance_check.py</text>
      <text class="sub" x="950" y="570" text-anchor="middle">predicted Risk vs what arrived</text>
      <rect class="box file" x="1215" y="530" width="165" height="56" rx="4"/>
      <text class="fn" x="1297" y="552" text-anchor="middle">risk_output_with</text>
      <text class="fn" x="1297" y="567" text-anchor="middle">_actuals.xlsx</text>
      <line class="edge" x1="190" y1="558" x2="828" y2="558" marker-end="url(#ah)"/>
      <text class="elabel" x="510" y="551" text-anchor="middle">map Material, Quantity, Date</text>
      <polyline class="edge" points="1297,406 1297,500 950,500 950,528" marker-end="url(#ah)"/>
      <text class="elabel" x="1124" y="493" text-anchor="middle">predictions</text>
      <line class="edge" x1="1070" y1="558" x2="1213" y2="558" marker-end="url(#ah)"/>
      <text class="elabel" x="1142" y="551" text-anchor="middle">accuracy, precision</text>
    </svg>
